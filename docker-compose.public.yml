name: postmaker-public

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rsshub:
    image: ${RSSHUB_IMAGE:-diygod/rsshub:latest}
    restart: unless-stopped
    environment:
      CACHE_TYPE: redis
      CACHE_EXPIRE: ${RSSHUB_CACHE_EXPIRE:-900}
      REDIS_URL: redis://redis:6379/1
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "1200"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:1200/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 25s

  dataradar:
    build:
      context: ./DataRadar
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      DATARADAR_AUTH_REQUIRED: "true"
      DATARADAR_SQLITE_PATH: /data/dataradar.sqlite3
      DATARADAR_WORKSPACES_DIR: /data/workspaces
      WORKSPACE_AUTH_SECRET: ${WORKSPACE_AUTH_SECRET:?WORKSPACE_AUTH_SECRET must be set in .env}
      RSSHUB_BASE_URL: http://rsshub:1200
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:${POSTMAKER_PORT:-8787}}
    volumes:
      - public_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  postmaker:
    build:
      context: .
      dockerfile: PostMaker/docker/Dockerfile
    restart: unless-stopped
    environment:
      POSTMAKER_AUTH_REQUIRED: "true"
      POSTMAKER_AUTH_DB: /data/auth.sqlite3
      POSTMAKER_WORKSPACES_DIR: /data/workspaces
      POSTMAKER_COOKIE_SECURE: ${POSTMAKER_COOKIE_SECURE:-false}
      DATARADAR_API_BASE: http://dataradar:8000
      RSSHUB_SOURCE_BASE_URL: http://rsshub:1200
      WORKSPACE_AUTH_SECRET: ${WORKSPACE_AUTH_SECRET:?WORKSPACE_AUTH_SECRET must be set in .env}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE: ${AI_API_BASE:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - public_data:/data
    ports:
      - "${POSTMAKER_PORT:-8787}:8787"
    depends_on:
      rsshub:
        condition: service_healthy
      dataradar:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  public_data:
