[project]
name = "dataradar"
version = "1.0.0"
description = "DataRadar - 数据采集与知识库系统"
requires-python = ">=3.12"
dependencies = [
    "requests==2.33.0",
    "httpx>=0.27.0",
    "pytz==2026.1",
    "PyYAML==6.0.3",
    "ruamel.yaml>=0.18.0",
    "feedparser==6.0.12",
    "boto3==1.42.76",
    "litellm==1.82.6",
    "json-repair==0.58.6",
    "tenacity==8.5.0",
]

[project.optional-dependencies]
full = [
    "trafilatura>=1.12.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
]
kb = [
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]
all = [
    "dataradar[full,kb,api]",
]

[project.scripts]
dataradar = "dataradar.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dataradar"]
