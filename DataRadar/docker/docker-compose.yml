services:
  # ════════════════════════════════════════════════════════════════
  # Infrastructure (new)
  # ════════════════════════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg16
    container_name: dataradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: dataradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataradar_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../knowledge_base/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataradar -d knowledge_base"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: dataradar-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  rsshub:
    image: diygod/rsshub:latest
    container_name: dataradar-rsshub
    restart: unless-stopped
    environment:
      - CACHE_TYPE=redis
      - CACHE_EXPIRE=600
      - REDIS_URL=redis://redis:6379/1
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:1200:1200"

  # ════════════════════════════════════════════════════════════════
  # Knowledge Base API (new)
  # ════════════════════════════════════════════════════════════════

  api-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: dataradar-api
    restart: unless-stopped
    command: >
      uvicorn api_server.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --loop uvloop
    environment:
      - POSTGRES_DSN=postgresql://dataradar:${POSTGRES_PASSWORD:-dataradar_secret}@postgres:5432/knowledge_base
      - REDIS_URL=redis://redis:6379/0
      - EMBED_MODEL=${EMBED_MODEL:-text-embedding-3-small}
      - EMBED_API_KEY=${AI_API_KEY:-}
      - EMBED_API_BASE=${AI_API_BASE:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: dataradar-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_PORT:-8000}:3333"   # 仅本地访问；公网部署请配合防火墙
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-server:
        condition: service_healthy

# ════════════════════════════════════════════════════════════════
# Named volumes
# ════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
  redis_data:
