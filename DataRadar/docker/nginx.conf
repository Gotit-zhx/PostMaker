# Nginx reverse proxy for DataRadar Knowledge Base API
# Listens on :3333 and forwards to the FastAPI server on :8000

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

upstream api_backend {
    server api-server:8000;
    keepalive 64;
}

server {
    listen 3333;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum request body size (for semantic search POST requests)
    client_max_body_size 1m;

    # Timeouts — semantic embedding can take 2-3s
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Keep-alive to upstream
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Pass real client IP
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API routes
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://api_backend;
    }

    # Health check (no auth required)
    location /health {
        proxy_pass http://api_backend;
    }

    # OpenAPI docs
    location /docs {
        proxy_pass http://api_backend;
    }

    location /openapi.json {
        proxy_pass http://api_backend;
    }

    # Root redirect to docs
    location = / {
        return 302 /docs;
    }

    # 404 for anything else
    location / {
        return 404 '{"error": "not found"}';
        add_header Content-Type application/json;
    }
}
