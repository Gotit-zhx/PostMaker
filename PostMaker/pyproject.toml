[project]
name = "postmaker"
version = "0.1.0"
description = "PostMaker - 矩阵运营内容生成系统"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "PyYAML==6.0.3",
    "litellm==1.82.6",
    "json-repair==0.58.6",
    "tenacity==8.5.0",
    "pydantic>=2.0.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
db = ["asyncpg>=0.29.0"]
all = ["postmaker[db]"]

[project.scripts]
postmaker = "postmaker.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.22.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests requiring Docker + AI API",
]

[tool.hatch.build.targets.wheel]
packages = ["postmaker"]
