app:
  timezone: "Asia/Shanghai"

dataradar:
  api_base: "http://localhost:8000"
  timeout: 15

ai:
  model: ""              # 环境变量 AI_MODEL
  api_key: ""            # 环境变量 AI_API_KEY
  api_base: ""           # 环境变量 AI_API_BASE
  timeout: 120
  temperature: 0.7
  max_tokens: 8000
  refine_enabled: false
  models:
    high: ""             # importance >= 4
    medium: ""           # importance 2-3

database:
  postgres_dsn: ""       # 环境变量 POSTGRES_DSN

output:
  base_dir: "output"
  formats:
    - markdown
    - html
