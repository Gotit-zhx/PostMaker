<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>PostMaker · 内容工作台</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/"><span class="brand-mark">P</span><span><b>postmaker</b><small>CONTENT STUDIO</small></span></a>
      <div class="workspace-label">工作区</div>
      <button class="nav-item active" data-view="materials"><span class="nav-icon">◈</span>素材库 <span class="nav-count" id="material-count">—</span></button>
      <button class="nav-item" data-view="drafts"><span class="nav-icon">▤</span>内容草稿 <span class="nav-count" id="draft-count">0</span></button>
      <div class="sidebar-bottom"><div class="local-badge"><span class="status-dot"></span><span><b>本地工作区</b><small>内容仅保存在此设备</small></span></div><a href="/api/health" target="_blank">服务状态 ↗</a></div>
    </aside>

    <main class="main-area">
      <header class="topbar"><div class="breadcrumb">工作区 <span>/</span> <b id="crumb">素材发现</b></div><div class="top-actions"><span class="today" id="today"></span><button class="icon-button" id="refresh" title="刷新">↻</button><div class="avatar">PM</div></div></header>
      <section class="page-heading"><div><div class="eyebrow">EDITORIAL WORKFLOW</div><h1 id="page-title">发现值得写的内容</h1><p id="page-subtitle">从行业素材开始，生成可审核、可追溯的内容草稿。</p></div><div class="heading-actions"><button id="toggle-view" class="button secondary">查看草稿 <span>→</span></button></div></section>

      <div class="workspace" id="materials-view">
        <section class="panel source-panel">
          <div class="panel-header"><div><h2>行业素材</h2><p>来自 DataRadar 的近期内容</p></div><div class="segmented"><button class="selected" data-mode="trending">热门</button><button data-mode="recent">最新</button></div></div>
          <div id="material-list" class="item-list"><div class="loading">正在连接 DataRadar…</div></div>
          <div class="panel-footer"><span id="material-meta">—</span><button class="text-button" id="load-more">刷新列表 ↻</button></div>
        </section>
        <section class="panel detail-panel" id="material-detail"><div class="empty-state"><div class="empty-icon">↖</div><h3>选择一条素材</h3><p>查看摘要与原文来源，然后选择 persona 生成初稿。</p></div></section>
      </div>

      <div class="workspace drafts-workspace hidden" id="drafts-view">
        <section class="panel source-panel draft-list-panel">
          <div class="panel-header"><div><h2>内容草稿</h2><p>编辑、审核并保留每次修订</p></div><select id="status-filter" class="select"><option value="all">全部状态</option><option value="pending_review">待审核</option><option value="approved">已批准</option><option value="archived">已归档</option></select></div>
          <div id="draft-list" class="item-list"><div class="empty-inline">还没有草稿。从素材库生成第一篇吧。</div></div>
          <div class="panel-footer"><span id="draft-meta">本地 SQLite</span><button class="text-button" id="refresh-drafts">刷新 ↻</button></div>
        </section>
        <section class="panel editor-panel" id="draft-detail"><div class="empty-state"><div class="empty-icon">▤</div><h3>选择一篇草稿</h3><p>你可以编辑、批准、归档或导出 Markdown。</p></div></section>
      </div>
      <div id="toast" class="toast" role="status"></div>
    </main>
  </div>
  <script src="/static/app.js" defer></script>
</body>
</html>
